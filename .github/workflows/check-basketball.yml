name: Validate basketball demo

on:
  pull_request:
    paths:
      - 'basketball/**'
      - 'tests/basketball.test.js'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-basketball.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify multi-page output
        run: |
          test -f dist/index.html
          test -f dist/basketball/index.html
